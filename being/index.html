<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Being (placeholder)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* PLACEHOLDER for the real figure (being2). It follows the contract in docs/being-contract.md:
   posts {type:'oeuvre-ready'} once and {type:'oeuvre-face', x, y, w, h, state} ~10×/s,
   listens for {type:'oeuvre-pointer', x, y} from the parent. */
(() => {
  const c = document.getElementById("c");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, DPR, ctx;
  const resize = () => { W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2); c.width = W * DPR; c.height = H * DPR; ctx = c.getContext("2d"); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); };
  resize(); addEventListener("resize", resize);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ptr = { x: 0, y: 0, has: false }, look = { x: 0, y: 0 };
  const parentOrigin = location.origin;
  addEventListener("message", e => {
    if (e.origin !== parentOrigin || !e.data) return;
    if (e.data.type === "oeuvre-pointer") { ptr.x = e.data.x; ptr.y = e.data.y; ptr.has = true; }
  });
  addEventListener("pointermove", e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.has = true; });
  const post = m => { if (parent !== window) parent.postMessage(m, parentOrigin); };

  let blink = 0, nextBlink = 2500;
  function lum(u, v, t) {
    const lx = look.x, ly = look.y, hx = lx * 0.07, hy = -0.12 + ly * 0.04, a = 0.6, b = 0.8;
    let s = 0;
    const sx = u / 1.5, sy = (v - 1.62) / 0.78;
    if (sx * sx + sy * sy < 1 && v > 0.95) {
      const fold = 0.5 + 0.5 * Math.sin(u * 7 + v * 2.5 - t * 0.0007 + Math.sin(v * 3 + t * 0.0004) * 1.5);
      s = (0.22 + 0.3 * (1 - Math.abs(sx))) * (0.55 + 0.45 * fold);
    }
    if (Math.abs(u - hx * 0.4) < 0.24 && v > 0.45 && v < 1.15) s = Math.max(s, 0.3 - 0.5 * Math.abs(u) + (v > 0.62 ? 0.08 : -0.1));
    const dx = (u - hx) / a, dy = (v - hy) / b, r2 = dx * dx + dy * dy;
    const hdx = (u - hx) / (a * 1.12), hdy = (v - hy + 0.06) / (b * 1.08);
    const hair = hdx * hdx + hdy * hdy < 1 && dy < -0.25 + 0.18 * Math.sin(dx * 3.2 + t * 0.0006);
    if (r2 < 1 || hair) {
      const nz = Math.sqrt(Math.max(0, 1 - r2));
      let Lx = -0.42 - lx * 0.35, Ly = -0.5 - ly * 0.2, Lz = 0.75; const Ln = Math.hypot(Lx, Ly, Lz); Lx /= Ln; Ly /= Ln; Lz /= Ln;
      s = 0.1 + 0.9 * Math.max(0, dx * Lx + dy * Ly + nz * Lz);
      if (hair) s = (0.12 + 0.55 * s) * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(u * 46 + v * 9 + Math.sin(u * 5 + t * 0.0009) * 2)));
      else {
        const fu = hx + lx * 0.16, fv = hy + 0.02 + ly * 0.08;
        for (const sd of [-1, 1]) {
          const ex = fu + sd * 0.23, ey = fv - 0.04, eh = 0.05 * (1 - blink) + 0.004;
          const e1 = (u - ex) / 0.115, e2 = (v - ey) / eh;
          if (e1 * e1 + e2 * e2 < 1) {
            s *= 0.55;
            const px = u - (ex + lx * 0.045), py = v - (ey + ly * 0.02);
            if (blink < 0.6 && px * px + py * py < 0.0014) s = 0.02;
            if (blink < 0.6 && Math.hypot(px + 0.015, py + 0.015) < 0.012) s = 1;
          }
          if (Math.abs(u - ex) < 0.15 && Math.abs(v - (ey - 0.13 - 0.18 * (u - ex) * (u - ex))) < 0.02) s *= 0.25;
          const so = Math.hypot((u - ex) / 0.17, (v - ey + 0.01) / 0.1); if (so < 1) s *= 0.75 + 0.25 * so;
        }
        if (u > fu + 0.015 && u < fu + 0.08 && v > fv && v < fv + 0.25) s *= 0.62;
        if (Math.hypot((u - fu) / 0.1, (v - fv - 0.27) / 0.028) < 1) s *= 0.45;
        const mo = 0.016 + 0.06 * Math.max(0, Math.sin(t * 0.0011) - 0.85);
        if (Math.hypot((u - fu) / 0.17, (v - fv - 0.44) / mo) < 1) s *= 0.08;
        for (let i = 0; i < 4; i++) {
          const w = 0.00035 + i * 0.00011, ph = i * 1.9;
          const qx = hx + 0.38 * Math.cos(t * w + ph) * Math.cos(t * w * 0.6 + i), qy = hy - 0.28 + 0.22 * Math.sin(t * w * 1.3 + ph);
          const d = Math.hypot(u - qx, v - qy); if (d < 0.07) s = Math.max(s, 1 - d / 0.07);
        }
      }
    }
    return clamp(s);
  }
  let geo = null;
  function draw(t) {
    const wide = W >= 860;
    const sc = wide ? Math.min(W * 0.2, H * 0.36) : Math.min(W * 0.42, H * 0.27);
    const cx = W / 2, cy = wide ? H * 0.46 : H * 0.5;
    geo = { cx, cy, sc };
    const step = Math.max(5, Math.min(10, sc / 34)), maxR = step * 0.53;
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = "#fff"; ctx.beginPath();
    const x0 = Math.max(0, cx - 1.7 * sc), x1 = Math.min(W, cx + 1.7 * sc), y0 = Math.max(0, cy - 1.2 * sc), y1 = Math.min(H, cy + 2.6 * sc);
    for (let y = y0 - (y0 % step) + step / 2; y < y1; y += step) {
      const v = (y - cy) / sc, fade = clamp((H - y) / 110);
      for (let x = x0 - (x0 % step) + step / 2; x < x1; x += step) {
        const s = lum((x - cx) / sc, v, t) * fade; if (s < 0.03) continue;
        const r = maxR * Math.sqrt(s); if (r < 0.35) continue;
        ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832);
      }
    }
    ctx.fill();
  }
  function faceBox() {
    const { cx, cy, sc } = geo, hx = look.x * 0.07, hy = -0.12 + look.y * 0.04;
    return { x: cx + (hx - 0.67) * sc, y: cy + (hy - 0.92) * sc, w: 1.34 * sc, h: 1.6 * sc };
  }
  function loop(t) {
    if (!reduced) requestAnimationFrame(loop);
    const tx = ptr.has ? clamp((ptr.x / W - 0.5) * 2, -1, 1) : Math.sin(t * 0.0003) * 0.4;
    const ty = ptr.has ? clamp((ptr.y / H - 0.47) * 2, -1, 1) : Math.sin(t * 0.0002) * 0.2;
    look.x += (tx - look.x) * 0.06; look.y += (ty - look.y) * 0.06;
    if (t > nextBlink) { const k = (t - nextBlink) / 180; blink = k < 1 ? Math.sin(k * Math.PI) : 0; if (k >= 1) nextBlink = t + 2500 + Math.random() * 4000; }
    draw(t);
  }
  requestAnimationFrame(loop);
  if (reduced) addEventListener("resize", () => requestAnimationFrame(loop));
  post({ type: "oeuvre-ready", camera: false, placeholder: true });
  setInterval(() => { if (geo) post({ type: "oeuvre-face", ...faceBox(), state: "idle" }); }, 100);
})();
</script>
</body>
</html>
